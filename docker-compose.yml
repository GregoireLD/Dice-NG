services:
  signal:
    build:
      context: apps/signal
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      signal:
        condition: service_healthy
    restart: unless-stopped
