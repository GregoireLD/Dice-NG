services:
  signal:
    build:
      context: apps/signal
      dockerfile: Dockerfile
    ports:
      # Bind to loopback only — Synology reverse proxy reaches it at localhost:3001
      # but it is not directly reachable from outside the NAS
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
